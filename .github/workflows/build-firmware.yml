name: Build SASMAN official-based firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, for example v2.0.0-official'
        required: true
        default: 'v2.0.0-official'
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  XM_URL: https://dl.ui.com/firmwares/XN-fw/v6.3.24/XM.v6.3.24.33508.251204.1904.bin
  XM_SHA256: 3c4cbf7928954fb27d4d85747a70b5af73232175ffa2225ddba5531a0474f1da
  XW_URL: https://dl.ui.com/firmwares/XW-fw/v6.3.24/XW.v6.3.24.33508.251204.1816.bin
  XW_SHA256: 90457c55c3daae3ebf1fb034dcfd56151316d6d6f464fc21c8fef48ed063fa53

concurrency:
  group: sasman-official-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build official-based ${{ matrix.platform }} firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: XM
            board: UBNTXM
            source_url: https://dl.ui.com/firmwares/XN-fw/v6.3.24/XM.v6.3.24.33508.251204.1904.bin
            source_sha256: 3c4cbf7928954fb27d4d85747a70b5af73232175ffa2225ddba5531a0474f1da
            source_name: XM.v6.3.24.33508.251204.1904.bin
          - platform: XW
            board: UBNTXW
            source_url: https://dl.ui.com/firmwares/XW-fw/v6.3.24/XW.v6.3.24.33508.251204.1816.bin
            source_sha256: 90457c55c3daae3ebf1fb034dcfd56151316d6d6f464fc21c8fef48ed063fa53
            source_name: XW.v6.3.24.33508.251204.1816.bin

    steps:
      - name: Checkout SASMAN project
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates curl python3 squashfs-tools

      - name: Download and verify official firmware
        env:
          SOURCE_URL: ${{ matrix.source_url }}
          SOURCE_SHA256: ${{ matrix.source_sha256 }}
          SOURCE_NAME: ${{ matrix.source_name }}
        run: |
          set -euo pipefail
          mkdir -p input
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            "$SOURCE_URL" -o "input/$SOURCE_NAME"
          printf '%s  %s\n' "$SOURCE_SHA256" "input/$SOURCE_NAME" | sha256sum --check --status
          printf 'verified_sha256=%s\n' "$SOURCE_SHA256"
          file "input/$SOURCE_NAME"

      - name: Unpack official rootfs
        env:
          SOURCE_NAME: ${{ matrix.source_name }}
          BOARD: ${{ matrix.board }}
        run: |
          set -euo pipefail
          mkdir -p work
          python3 tools/official/ubnt_image.py unpack \
            "input/$SOURCE_NAME" work --board "$BOARD"
          rm -rf work/rootfs
          unsquashfs -d work/rootfs work/rootfs.squashfs

      - name: Apply SASMAN presentation layer
        run: |
          set -euo pipefail
          python3 tools/official/rebrand_web.py \
            work/rootfs/usr/www \
            assets/sasman_logo.png \
            tools/official/sasman_official.css
          test -f work/rootfs/usr/www/images/sasman_logo.png
          grep -q SASMAN work/rootfs/usr/www/login.cgi
          grep -q SASMAN work/rootfs/usr/www/lib/head.tmpl

      - name: Rebuild rootfs with official-compatible SquashFS settings
        run: |
          set -euo pipefail
          mksquashfs work/rootfs work/rootfs-sasman.squashfs \
            -comp lzma -b 131072 -noappend -all-root -no-xattrs
          python3 tools/official/check_rootfs.py work/metadata.json work/rootfs-sasman.squashfs

      - name: Repack and verify official-based image
        env:
          SOURCE_NAME: ${{ matrix.source_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          output="release-assets/SASMAN-${PLATFORM}-${SOURCE_NAME%.bin}-unsigned.bin"
          python3 tools/official/ubnt_image.py repack \
            "input/$SOURCE_NAME" work/rootfs-sasman.squashfs "$output"
          python3 tools/official/ubnt_image.py verify "$output"
          sha256sum "$output" > "release-assets/SHA256SUMS-${PLATFORM}.txt"
          cat > "release-assets/BUILD-NOTICE-${PLATFORM}.txt" <<'NOTICE'
          SASMAN official-based firmware build.

          The image preserves the official platform kernel/u-boot/EXEC payloads and replaces the web root with the SASMAN presentation layer.
          Structural CRCs are recalculated. This image is not RSA-signed by Ubiquiti and must not be treated as an official signed image.
          Confirm the device board exactly: XM images are only for XM; XW images are only for XW.
          Keep an original recovery image and a verified TFTP recovery path before any test.
          NOTICE
          ls -lh release-assets

      - name: Upload ${{ matrix.platform }} firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: sasman-${{ matrix.platform }}-official-firmware
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish XM and XW BIN files
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sasman-*-official-firmware
          path: release
          merge-multiple: true

      - name: Resolve release tag
        id: release-tag
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="$DISPATCH_VERSION"
          fi
          [[ "$tag" == v* ]] || { echo 'Release tag must start with v'; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: SASMAN official-based firmware ${{ steps.release-tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/**/*.bin
            release/**/SHA256SUMS-*.txt
            release/**/BUILD-NOTICE-*.txt
